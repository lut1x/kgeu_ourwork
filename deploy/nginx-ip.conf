server {
    listen 80;
    server_name 170.168.150.194;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://170.168.150.194$request_uri; }
}
server {
    listen 443 ssl;
    server_name 170.168.150.194;
    ssl_certificate /etc/letsencrypt/live/170.168.150.194/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/170.168.150.194/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
    location /api/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
    location /socket.io/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 86400;
    }
}
